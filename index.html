<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QCM Master</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Application Principale -->
  <div id="main-app">
    <header class="app-header">
      <div class="logo-title" onclick="app.showTab('dashboard')">📚 QCM Master</div>
      <button id="theme-toggle" class="btn-icon">🌙</button>
    </header>

    <nav class="app-nav">
      <button class="nav-btn active" data-tab="dashboard">🏠 Accueil</button>
      <button class="nav-btn" data-tab="create">➕ Ajouter</button>
      <button class="nav-btn" data-tab="stats">📊 Stats</button>
    </nav>

    <main class="app-container">

      <!-- ACCUEIL -->
      <section id="tab-dashboard" class="tab-content active">
        <div class="dashboard-banner">
          <h2>Tableau de bord</h2>
          <div class="quick-stats-row">
            <div class="stat-card">
              <span class="stat-val" id="total-cards-count">0</span>
              <span class="stat-lbl">QCM</span>
            </div>
            <div class="stat-card">
              <span class="stat-val" id="global-success-rate">0%</span>
              <span class="stat-lbl">Réussite</span>
            </div>
          </div>
        </div>

        <div class="section-card">
          <h3>🚀 Modes Rapides</h3>
          <div class="modes-grid">
            <button class="btn-mode" onclick="app.startFilteredSession('errors')">🎯 Erreurs (<50%)</button>
            <button class="btn-mode" onclick="app.startFilteredSession('spaced')">⏳ Vieilles séries (>7j)</button>
            <button class="btn-mode" onclick="app.startFilteredSession('starred')">⭐ Favorites</button>
          </div>
        </div>

        <div class="section-card">
          <div class="section-header-inline">
            <h3>📂 Dossiers</h3>
            <button class="btn-sm btn-primary" onclick="app.promptCreateFolder()">+ Dossier</button>
          </div>
          <div id="tree-container" class="tree-view"></div>
        </div>
      </section>

      <!-- CREATION & IMPORT -->
      <section id="tab-create" class="tab-content">
        <div class="section-card">
          <h3>📥 Importer des QCM</h3>
          <p class="help-text">Colle ton JSON ou importe un fichier.</p>
          <div class="import-area">
            <textarea id="import-text" placeholder="Colle ton code JSON ici..."></textarea>
            <button class="btn-primary" onclick="app.importFromText()">Importer le texte</button>
            <label class="btn-secondary file-input-label">
              📁 Choisir un fichier .json
              <input type="file" id="import-file" accept=".json" onchange="app.importFromFile(event)">
            </label>
          </div>
        </div>

        <div class="section-card">
          <h3>✏️ Ajouter un QCM</h3>
          <form id="create-qcm-form" onsubmit="app.handleManualCreate(event)">
            <div class="form-group">
              <label>Dossier :</label>
              <select id="create-folder-select" required></select>
            </div>
            <div class="form-group">
              <label>Question :</label>
              <textarea id="create-question" required></textarea>
            </div>
            <div class="form-group">
              <label>Propositions (Coche la/les bonnes) :</label>
              <div id="options-builder"></div>
              <button type="button" class="btn-sm btn-secondary" onclick="app.addOptionInput()">+ Option</button>
            </div>
            <div class="form-group">
              <label>Explication (Optionnel) :</label>
              <textarea id="create-explanation"></textarea>
            </div>
            <button type="submit" class="btn-primary">Enregistrer</button>
          </form>
        </div>

        <div class="section-card">
          <h3>📤 Exporter</h3>
          <div class="export-buttons">
            <button class="btn-secondary" onclick="app.exportData(false)">📦 Exporter Tout</button>
            <button class="btn-secondary" onclick="app.exportData(true)">🤝 Exporter Sans Stats (Partage)</button>
          </div>
        </div>
      </section>

      <!-- STATS -->
      <section id="tab-stats" class="tab-content">
        <div class="section-card">
          <h3>📊 Statistiques détaillées</h3>
          <div id="stats-details-list"></div>
        </div>
      </section>

    </main>
  </div>

  <!-- MODE REVISION (MASQUÉ PAR DÉFAUT) -->
  <div id="quiz-overlay" class="quiz-overlay hidden">
    <div class="quiz-header">
      <button class="btn-sm btn-danger" onclick="app.quitQuiz()">❌ Quitter</button>
      <div class="quiz-info-center">
        <div id="quiz-title">Session</div>
        <div id="quiz-progress">1/10</div>
      </div>
      <div class="quiz-timers">
        <div id="timer-global" class="badge-timer">G: 00:00</div>
        <div id="timer-question" class="badge-timer">Q: 00:00</div>
      </div>
    </div>

    <div class="exam-grid-drawer">
      <button class="btn-drawer-toggle" onclick="app.toggleExamGrid()">📋 Grille des questions</button>
      <div id="exam-grid-container" class="exam-grid hidden"></div>
    </div>

    <div class="quiz-body">
      <div class="question-box">
        <button id="star-btn" class="star-btn" onclick="app.toggleCurrentStar()">⭐</button>
        <p id="quiz-question-text" class="question-text"></p>
      </div>

      <div id="quiz-options-container" class="quiz-options"></div>

      <div id="quiz-explanation" class="explanation-box hidden">
        <h4>💡 Explication :</h4>
        <p id="quiz-explanation-text"></p>
      </div>
    </div>

    <div class="quiz-footer">
      <button id="btn-prev-q" class="btn-secondary" onclick="app.prevQuestion()">⬅️ Précédent</button>
      <button id="btn-skip-q" class="btn-secondary" onclick="app.skipQuestion()">⏭️ Passer</button>
      <button id="btn-validate-q" class="btn-primary" onclick="app.validateQuestion()">Valider</button>
      <button id="btn-next-q" class="btn-primary hidden" onclick="app.nextQuestion()">Suivant ➡️</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
